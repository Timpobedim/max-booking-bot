[project]
name = "max-booking-bot"
version = "1.0.0"
description = "Клиент MAX Bot API (maxkit) и бот записи в шиномонтаж на нём"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic-settings>=2.10",
    "tzdata>=2024.1; sys_platform == 'win32'",  # в Windows нет системной базы часовых поясов
]

[project.scripts]
tyre-bot = "tyre_bot.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
    "mypy>=1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maxkit", "src/tyre_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "PT", "RUF"]
# RUF001-003: в русских строках есть кириллица, похожая на латиницу, — это нормально.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["maxkit", "tyre_bot"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
